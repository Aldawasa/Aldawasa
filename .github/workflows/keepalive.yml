name: Site Health Check

# مراقبة صحة قاعدة بيانات المجلة (مشروع Pro — لا يتوقف تلقائيًا). يرسل GitHub تنبيهًا بالإيميل إذا فشل.
# يرسل طلب قراءة بسيط كل يومين. يستخدم المفتاح العام (anon) وهو ظاهر أصلًا في صفحة الموقع.

on:
  schedule:
    - cron: '0 6 */2 * *'   # كل يومين الساعة 6:00 UTC (9 صباحًا بتوقيت السعودية)
  workflow_dispatch:         # يمكن تشغيله يدويًا من تبويب Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          URL="https://qkwadlsmvlnpcoeccqsf.supabase.co/rest/v1/offers?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrd2FkbHNtdmxucGNvZWNjcXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MjQ3MTUsImV4cCI6MjA4MzMwMDcxNX0.cNMBjD_wTusoc9OxcRP7ql1U35-SRdgsfq9sqKoKEd8"
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          cat /tmp/out.txt
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $CODE — قد يكون المشروع متوقفًا"
            exit 1
          fi
          echo "✅ Supabase is awake"
